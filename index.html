<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Lector de Relatos</title>

  <style>
    :root {
      --bg: #0f0d0d;
      --panel: #181414;
      --paper: #f4edde;
      --text: #f5efe3;
      --muted: #c8bba7;
      --line: rgba(202, 176, 120, 0.38);
      --accent: #8b1e24;
      --accent-dark: #64151a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(139,30,36,0.18), transparent 32%),
        linear-gradient(180deg, #161111 0%, #090808 100%);
    }

    .reader-shell {
      width: 100%;
      height: 100vh;
      height: 100svh;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reader-header {
      flex: 0 0 auto;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 14px 16px;
      border: 1px solid var(--line);
      background: rgba(24, 20, 20, 0.94);
      border-radius: 14px;
      box-shadow: 0 14px 34px rgba(0,0,0,0.32);
    }

    .eyebrow {
      margin: 0 0 4px;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--muted);
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 38px);
      line-height: 1.05;
      letter-spacing: 0.02em;
    }

    .intro {
      margin: 8px 0 0;
      max-width: 820px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .controls {
      flex: 0 0 auto;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 10px;
      border: 1px solid rgba(202, 176, 120, 0.26);
      background: rgba(10, 8, 8, 0.72);
      border-radius: 14px;
    }

    .control-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .page-status {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      min-height: 20px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 40px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(24, 20, 20, 0.96);
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    .btn.primary {
      background: var(--accent);
      border-color: rgba(255,255,255,0.16);
    }

    .btn.primary:hover {
      background: var(--accent-dark);
    }

    .btn:active {
      transform: scale(0.97);
      background: rgba(60, 45, 35, 0.98);
      border-color: rgba(245, 239, 227, 0.72);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .reader-stage {
      flex: 1 1 auto;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(5, 4, 4, 0.72);
      box-shadow: 0 18px 45px rgba(0,0,0,0.48);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .canvas-holder {
      min-width: 100%;
      width: max-content;
      padding: 16px;
      text-align: center;
    }

    canvas.pdf-page {
      display: inline-block;
      background: var(--paper);
      border-radius: 6px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.48);
    }

    .message {
      flex: 0 0 auto;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
      min-height: 18px;
    }

    .error {
      color: #ffd7d7;
    }

    body.reading-mode .reader-header,
    body.reading-mode .controls,
    body.reading-mode .message {
      display: none;
    }

    body.reading-mode .reader-shell {
      padding: 0;
      gap: 0;
    }

    body.reading-mode .reader-stage {
      width: 100%;
      max-width: none;
      height: 100vh;
      height: 100svh;
      margin: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: #050404;
    }

    body.reading-mode .canvas-holder {
      padding: 10px;
    }

    /* Barra flotante compacta, inspirada en el visor de Bases */
    .floating-reader {
      display: none;
      position: fixed;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      z-index: 2147483647;

      width: auto;
      max-width: calc(100% - 24px);

      align-items: center;
      justify-content: center;
      gap: 10px;

      padding: 10px 16px;
      border: 1px solid rgba(202, 176, 120, 0.36);
      border-radius: 999px;
      background: rgba(10, 8, 8, 0.94);
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 34px rgba(0,0,0,0.65);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .floating-reader::-webkit-scrollbar {
      display: none;
    }

    body.reading-mode .floating-reader {
      display: flex !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .float-btn {
      width: 58px;
      min-width: 58px;
      height: 46px;
      min-height: 46px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(202, 176, 120, 0.38);
      border-radius: 999px;
      background: rgba(24, 20, 20, 0.96);
      color: #f5efe3;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.04em;
      text-transform: uppercase;

      cursor: pointer;
      user-select: none;
      touch-action: manipulation;

      transition:
        transform 0.08s ease,
        background 0.12s ease,
        border-color 0.12s ease,
        box-shadow 0.12s ease;
    }

    .float-status {
      min-width: 56px;
      text-align: center;
      color: #f5efe3;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    #floatZoomOut {
      background: rgba(245, 239, 227, 0.48);
      color: #161111;
      border-color: rgba(245, 239, 227, 0.35);
      font-size: 26px;
      font-family: Arial, Helvetica, sans-serif;
    }

    #floatZoomIn {
      background: #f5efe3;
      color: #161111;
      border-color: #f5efe3;
      font-size: 26px;
      font-family: Arial, Helvetica, sans-serif;
    }

    #exitRead {
      width: auto;
      min-width: 76px;
      height: 40px;
      min-height: 40px;
      padding: 0 18px;
      background: #f5efe3;
      color: #161111;
      border-color: #f5efe3;
      font-size: 13px;
      letter-spacing: 0.02em;
      text-transform: none;
    }

    .float-btn:active {
      transform: scale(0.94);
      box-shadow: inset 0 3px 10px rgba(0,0,0,0.35);
      border-color: rgba(245, 239, 227, 0.75);
    }

    .float-btn:disabled {
      opacity: 0.36;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      .reader-shell {
        padding: 10px;
        gap: 8px;
      }

      .reader-header {
        padding: 12px 13px;
        border-radius: 12px;
      }

      .intro {
        font-size: 13px;
      }

      .controls {
        padding: 8px;
        border-radius: 12px;
      }

      .control-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .control-row.main-actions {
        grid-template-columns: 1fr;
      }

      .btn {
        width: 100%;
        min-height: 42px;
        padding: 9px 10px;
        font-size: 11px;
      }

      .canvas-holder {
        padding: 12px;
      }

      canvas.pdf-page {
        border-radius: 4px;
      }

      body.reading-mode .floating-reader {
  top: max(10px, env(safe-area-inset-top));
  bottom: auto;

  width: calc(100% - 14px);
  max-width: none;

  justify-content: center;
  gap: 6px;
  padding: 8px 8px;
}

      .float-btn {
        width: 46px;
        min-width: 46px;
        height: 42px;
        min-height: 42px;
        font-size: 16px;
      }

      .float-status {
        min-width: 44px;
        font-size: 12px;
      }

      #floatZoomOut,
      #floatZoomIn {
        font-size: 23px;
      }

      #exitRead {
        min-width: 62px;
        height: 38px;
        min-height: 38px;
        padding: 0 12px;
        font-size: 12px;
      }
    }
    /* FORZAR BARRA ARRIBA EN MÓVIL Y WEB */
body.reading-mode .floating-reader {
  position: fixed !important;
  top: 14px !important;
  bottom: auto !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
}

@media (max-width: 900px) {
  body.reading-mode .floating-reader {
    position: fixed !important;
    top: max(12px, env(safe-area-inset-top)) !important;
    bottom: auto !important;
    left: 50% !important;
    transform: translateX(-50%) !important;

    width: calc(100% - 14px) !important;
    max-width: none !important;
  }
}
  </style>
</head>

<body>
  <main class="reader-shell">
    <section class="reader-header">
      <p class="eyebrow">Lector en línea</p>
      <h1>Relatos de Terror</h1>
      <p class="intro">
        Lee el PDF página por página. Usa el zoom para agrandar el texto y mueve la página con el dedo si queda más ancha que la pantalla.
      </p>
    </section>

    <section class="controls">
      <div class="page-status" id="pageStatus">
        Cargando archivo...
      </div>

      <div class="control-row">
        <button class="btn" id="prevBtn">← Anterior</button>
        <button class="btn" id="nextBtn">Siguiente →</button>
      </div>

      <div class="control-row">
        <button class="btn" id="zoomOutBtn">Zoom -</button>
        <button class="btn" id="fitBtn">Ajustar ancho</button>
        <button class="btn" id="readingBtn">Leer más grande</button>
        <button class="btn" id="zoomInBtn">Zoom +</button>
      </div>

      <div class="control-row main-actions">
        <button class="btn primary" id="fullBtn">Pantalla completa</button>
        <button class="btn" id="homeBtn">Volver al inicio</button>
      </div>
    </section>

    <section class="reader-stage" id="stage">
      <div class="canvas-holder" id="canvasHolder"></div>
    </section>

    <p class="message" id="message">
      Consejo: en celular, usa “Leer más grande” para que el texto no quede pequeño.
    </p>

    <div class="floating-reader" id="floatingReader">
      <button class="float-btn" id="floatPrev" aria-label="Página anterior">←</button>
      <span class="float-status" id="floatStatus">1 / 1</span>
      <button class="float-btn" id="floatNext" aria-label="Página siguiente">→</button>
      <button class="float-btn" id="floatZoomOut" aria-label="Reducir zoom">−</button>
      <button class="float-btn" id="floatZoomIn" aria-label="Aumentar zoom">+</button>
      <button class="float-btn" id="exitRead">Salir</button>
    </div>
  </main>

  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/build/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.7.284/build/pdf.worker.min.mjs";

    const pdfUrl = "relatos.pdf";

    const stage = document.getElementById("stage");
    const canvasHolder = document.getElementById("canvasHolder");
    const pageStatus = document.getElementById("pageStatus");
    const message = document.getElementById("message");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const zoomOutBtn = document.getElementById("zoomOutBtn");
    const zoomInBtn = document.getElementById("zoomInBtn");
    const fitBtn = document.getElementById("fitBtn");
    const readingBtn = document.getElementById("readingBtn");
    const fullBtn = document.getElementById("fullBtn");
    const homeBtn = document.getElementById("homeBtn");

    const exitRead = document.getElementById("exitRead");
    const floatPrev = document.getElementById("floatPrev");
    const floatNext = document.getElementById("floatNext");
    const floatZoomOut = document.getElementById("floatZoomOut");
    const floatZoomIn = document.getElementById("floatZoomIn");
    const floatStatus = document.getElementById("floatStatus");

    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;

    let zoom = window.innerWidth <= 640 ? 1.28 : 1;
    const minZoom = 0.85;
    const maxZoom = 2.3;

    let renderToken = 0;

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle("error", isError);
    }

    function updateButtons() {
      const hasPdf = totalPages > 0;

      prevBtn.disabled = !hasPdf || currentPage <= 1;
      nextBtn.disabled = !hasPdf || currentPage >= totalPages;
      floatPrev.disabled = !hasPdf || currentPage <= 1;
      floatNext.disabled = !hasPdf || currentPage >= totalPages;

      const statusText = hasPdf
        ? `${currentPage} / ${totalPages}`
        : "…";

      floatStatus.textContent = statusText;

      pageStatus.textContent = hasPdf
        ? `Página ${currentPage} de ${totalPages} · Zoom ${Math.round(zoom * 100)}%`
        : "Cargando archivo...";
    }

    function getFitScale(pageViewport) {
      const availableWidth = Math.max(280, stage.clientWidth - 34);
      return availableWidth / pageViewport.width;
    }

    async function renderCurrentPage(keepScroll = false) {
      if (!pdfDoc) return;

      const token = ++renderToken;

      canvasHolder.innerHTML = "";
      pageStatus.textContent = `Preparando página ${currentPage}...`;

      try {
        const page = await pdfDoc.getPage(currentPage);

        if (token !== renderToken) return;

        const baseViewport = page.getViewport({ scale: 1 });
        const fitScale = getFitScale(baseViewport);
        const finalScale = fitScale * zoom;
        const viewport = page.getViewport({ scale: finalScale });

        const outputScale = Math.min(window.devicePixelRatio || 1, 1.8);

        const canvas = document.createElement("canvas");
        canvas.className = "pdf-page";

        const context = canvas.getContext("2d", { alpha: false });

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);

        canvas.style.width = `${Math.floor(viewport.width)}px`;
        canvas.style.height = `${Math.floor(viewport.height)}px`;

        canvasHolder.appendChild(canvas);

        await page.render({
          canvasContext: context,
          viewport,
          transform: outputScale !== 1
            ? [outputScale, 0, 0, outputScale, 0, 0]
            : null
        }).promise;

        if (token !== renderToken) return;

        updateButtons();

        requestAnimationFrame(() => {
          if (!keepScroll) {
            stage.scrollTop = 0;
            stage.scrollLeft = Math.max(0, (stage.scrollWidth - stage.clientWidth) / 2);
          }
        });

      } catch (error) {
        console.error(error);
        setMessage("No se pudo cargar esta página. Revisa que el PDF se llame exactamente relatos.pdf.", true);
      }
    }

    async function loadPdf() {
      try {
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        pdfDoc = await loadingTask.promise;
        totalPages = pdfDoc.numPages;
        updateButtons();
        await renderCurrentPage();
        setMessage("Usa los botones para avanzar, ajustar ancho o agrandar la lectura.");
      } catch (error) {
        console.error(error);
        setMessage("No se pudo cargar el PDF. Revisa que relatos.pdf esté en el mismo repositorio que index.html.", true);
        pageStatus.textContent = "Error al cargar el archivo";
      }
    }

    prevBtn.addEventListener("click", async () => {
      if (currentPage > 1) {
        currentPage--;
        await renderCurrentPage();
      }
    });

    nextBtn.addEventListener("click", async () => {
      if (currentPage < totalPages) {
        currentPage++;
        await renderCurrentPage();
      }
    });

    zoomOutBtn.addEventListener("click", async () => {
      zoom = Math.max(minZoom, zoom - 0.15);
      await renderCurrentPage(true);
    });

    zoomInBtn.addEventListener("click", async () => {
      zoom = Math.min(maxZoom, zoom + 0.15);
      await renderCurrentPage(true);
    });

    fitBtn.addEventListener("click", async () => {
      zoom = 1;
      await renderCurrentPage();
      setMessage("Página ajustada al ancho de la pantalla.");
    });

    readingBtn.addEventListener("click", async () => {
      document.body.classList.add("reading-mode");
      zoom = window.innerWidth <= 640 ? 1.7 : 1.35;
      await renderCurrentPage();
    });

    fullBtn.addEventListener("click", async () => {
      document.body.classList.add("reading-mode");

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        // Si el navegador no permite pantalla completa, queda activo el modo lectura.
      }

      await renderCurrentPage();
    });

    exitRead.addEventListener("click", async () => {
      document.body.classList.remove("reading-mode");

      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        }
      } catch (error) {}

      zoom = window.innerWidth <= 640 ? 1.28 : 1;
      await renderCurrentPage();
    });

    floatPrev.addEventListener("click", async () => {
      if (currentPage > 1) {
        currentPage--;
        await renderCurrentPage();
      }
    });

    floatNext.addEventListener("click", async () => {
      if (currentPage < totalPages) {
        currentPage++;
        await renderCurrentPage();
      }
    });

    floatZoomOut.addEventListener("click", async () => {
      zoom = Math.max(minZoom, zoom - 0.15);
      await renderCurrentPage(true);
    });

    floatZoomIn.addEventListener("click", async () => {
      zoom = Math.min(maxZoom, zoom + 0.15);
      await renderCurrentPage(true);
    });

    homeBtn.addEventListener("click", () => {
      window.open("https://relatosdeterror.carrd.co", "_top");
    });

    window.addEventListener("keydown", async (event) => {
      if (event.key === "ArrowLeft" && currentPage > 1) {
        currentPage--;
        await renderCurrentPage();
      }

      if (event.key === "ArrowRight" && currentPage < totalPages) {
        currentPage++;
        await renderCurrentPage();
      }

      if (event.key === "Escape" && document.body.classList.contains("reading-mode")) {
        document.body.classList.remove("reading-mode");
        await renderCurrentPage();
      }
    });

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        renderCurrentPage(true);
      }, 250);
    });

    loadPdf();
  </script>
</body>
</html>
