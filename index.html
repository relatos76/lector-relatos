<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lector de Relatos</title>

  <style>
    :root {
      --bg: #0f0d0d;
      --panel: #181414;
      --paper: #f2eadc;
      --text: #f5efe3;
      --muted: #c8bba7;
      --line: rgba(202, 176, 120, 0.38);
      --accent: #8b1e24;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      height: 100%;
    }

    .reader-shell {
      width: 100%;
      min-height: 100vh;
      padding: 18px;
      background:
        radial-gradient(circle at top, rgba(139,30,36,0.18), transparent 34%),
        linear-gradient(180deg, #161111 0%, #090808 100%);
    }

    .reader-header {
      max-width: 980px;
      margin: 0 auto 14px;
      padding: 18px 18px 16px;
      border: 1px solid var(--line);
      background: rgba(24, 20, 20, 0.92);
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.35);
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: 0.16em;
      color: var(--muted);
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 40px);
      line-height: 1.05;
      letter-spacing: 0.02em;
    }

    .intro {
      margin: 10px 0 0;
      max-width: 760px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .actions {
      max-width: 980px;
      margin: 0 auto 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 44px;
      padding: 11px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(24, 20, 20, 0.96);
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn.primary {
      background: var(--accent);
      border-color: rgba(255,255,255,0.16);
    }

    .pdf-frame {
      max-width: 980px;
      height: 78vh;
      min-height: 620px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 22px 55px rgba(0,0,0,0.48);
    }

    .pdf-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--paper);
    }

    .note {
      max-width: 980px;
      margin: 12px auto 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    @media (max-width: 640px) {
      .reader-shell {
        padding: 12px;
      }

      .reader-header {
        padding: 16px;
        border-radius: 12px;
      }

      .intro {
        font-size: 15px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .btn {
        width: 100%;
      }

      .pdf-frame {
        height: 72vh;
        min-height: 560px;
        border-radius: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="reader-shell">
    <section class="reader-header">
      <p class="eyebrow">Lector en línea</p>
      <h1>Relatos de Terror</h1>
      <p class="intro">
        Puedes leer el PDF completo desde esta página. Si el visor se siente pequeño en tu celular,
        usa el botón para abrirlo en pantalla completa.
      </p>
    </section>

    <div class="actions">
      <a class="btn primary" href="relatos.pdf" target="_blank" rel="noopener">
        Abrir en pantalla completa
      </a>

        </div>

    <section class="pdf-frame">
      <iframe src="relatos.pdf"></iframe>
    </section>

    <p class="note">
      Lectura directa desde el navegador. No necesitas descargar el archivo para empezar a leer.
    </p>
  </main>
</body>
</html>
